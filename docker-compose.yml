services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      AIDA_DEMO_SCENARIO: ${AIDA_DEMO_SCENARIO:-base}
      AIDA_INCIDENT_POLICY_VERSION: ${AIDA_INCIDENT_POLICY_VERSION:-incident-priority-v1}
      AIDA_COPILOT_ENABLED: ${AIDA_COPILOT_ENABLED:-false}
      AIDA_COPILOT_PROVIDER: ${AIDA_COPILOT_PROVIDER:-ollama}
      AIDA_COPILOT_MODEL: ${AIDA_COPILOT_MODEL:-gpt-oss:120b}
      AIDA_COPILOT_BASE_URL: ${AIDA_COPILOT_BASE_URL:-https://ollama.com/api}
      AIDA_COPILOT_API_KEY: ${AIDA_COPILOT_API_KEY:-}
      AIDA_COPILOT_TIMEOUT_SECONDS: ${AIDA_COPILOT_TIMEOUT_SECONDS:-60}
      AIDA_COPILOT_FALLBACK: ${AIDA_COPILOT_FALLBACK:-rule_based}
      AIDA_COPILOT_TEMPERATURE: ${AIDA_COPILOT_TEMPERATURE:-0.1}
      AIDA_COPILOT_PROMPT_VERSION: ${AIDA_COPILOT_PROMPT_VERSION:-poc-002-v1}
      AIDA_COPILOT_MAX_CONTEXT_RECORDS: ${AIDA_COPILOT_MAX_CONTEXT_RECORDS:-30}
    volumes:
      - ./data/scenarios:/app/data/scenarios:ro

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
    depends_on:
      - backend
